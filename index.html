<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101117" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>Knotebook Store</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Knotebook <span>Store</span></h1>
      <a id="open-player" href="#">Open Player</a>
    </header>
    <main>
      <p class="intro">
        Packs are self-contained. Install one in the Player, then read offline.
      </p>
      <div id="filters" class="filters" role="group" aria-label="Filter packs by theme"></div>
      <ul id="packs" class="grid"></ul>
      <p id="status">Loading catalogue…</p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
